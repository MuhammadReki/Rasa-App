name: rasa
description: "Ruang aman untuk rasa — blog & storytelling app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.4

  # Firebase (Push Notification)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # UI & Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Media & Files
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  screenshot: ^3.0.0
  path_provider: ^2.1.4

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.3.3

  # ENV
  flutter_dotenv: ^5.2.1          # ← TAMBAH

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - .env                         # ← TAMBAH

# ===================
# Flutter Launcher Icons
# ===================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAF3E0"
  adaptive_icon_foreground: "assets/logo/logo.png"